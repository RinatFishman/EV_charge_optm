<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The card</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}button{font:inherit;cursor:pointer}</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;padding:56px 24px 28px;background:#DCE6F5;color:#1B1D4E;font-family:'Familjen Grotesk',system-ui,sans-serif;display:flex;flex-direction:column">
  <h1 style="margin:0;font-size:30px;font-weight:700;letter-spacing:-0.02em">Charging near you</h1>
  <div style="margin-top:24px;width:100%;height:196px;box-sizing:border-box;padding:22px;border-radius:20px;background:#1B1D4E;color:#F3F1FF;display:flex;flex-direction:column;justify-content:space-between">
    <div style="display:flex;justify-content:space-between;font-size:15px;font-weight:600"><span>Ecurious</span><span style="opacity:.7;font-weight:500">Your card</span></div>
    <div>
      <div style="font-size:14px;opacity:.75">Best price for 30 kWh</div>
      <div style="font-size:60px;font-weight:600;line-height:1;margin-top:6px;letter-spacing:-0.03em">€16.20</div>
      <div style="font-size:14px;margin-top:8px;opacity:.85">Voltwerk, 22 kW, 320 m away</div>
    </div>
  </div>
  <div style="display:flex;gap:18px;margin-top:24px;font-size:15px;font-weight:600">
    <button style="background:none;border:0;padding:0;color:#1B1D4E;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px;text-decoration-color:{{accent}}">Cheapest</button>
    <button style="background:none;border:0;padding:0;color:#4A4E7A;font-weight:500">Closest</button>
    <button style="background:none;border:0;padding:0;color:#4A4E7A;font-weight:500">Greenest</button>
  </div>
  <button style="margin-top:18px;width:100%;height:56px;border:0;border-radius:14px;background:{{accent}};color:#1B1D4E;font-size:16px;font-weight:700">Reserve at €16.20</button>
  <div style="margin-top:26px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><div><div style="font-size:17px;font-weight:600">Nordlade</div><div style="font-size:14px;color:#4A4E7A">150 kW, 560 m away</div></div><div style="font-size:17px;font-weight:600">€18.60</div></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline"><div><div style="font-size:17px;font-weight:600">Ampera Go</div><div style="font-size:14px;color:#4A4E7A">CCS, 740 m away</div></div><div style="font-size:17px;font-weight:600">€20.70</div></div>
  </div>
  <div style="margin-top:auto;font-size:13px;line-height:1.5;color:#4A4E7A">Your card finds the best price on the map. The price holds when you reserve.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF7A45"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#FF7A45' };
}
}
</script>
</body>
</html>
