<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Night map</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0}button{font:inherit;cursor:pointer}</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:{{bg}};color:{{ink}};font-family:'Hanken Grotesk',system-ui,sans-serif">
  <svg width="390" height="420" viewBox="0 0 390 420" aria-hidden="true" style="position:absolute;top:0;left:0">
    <path d="M-10 120 C120 100 220 180 400 150" stroke="{{road}}" stroke-width="14" fill="none"></path>
    <path d="M90 -10 L150 430" stroke="{{road}}" stroke-width="10" fill="none"></path>
    <path d="M-10 330 L400 280" stroke="{{roadWide}}" stroke-width="18" fill="none"></path>
    <path d="M300 -10 C260 150 330 300 280 430" stroke="{{road}}" stroke-width="8" fill="none"></path>
    <circle cx="150" cy="210" r="7" fill="{{pin}}"></circle>
    <circle cx="236" cy="268" r="7" fill="{{pin}}"></circle>
    <circle cx="112" cy="296" r="24" fill="{{accent}}" opacity=".22"></circle>
    <circle cx="112" cy="296" r="9" fill="{{accent}}"></circle>
  </svg>
  <h1 style="position:absolute;top:56px;left:24px;margin:0;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;font-size:26px;letter-spacing:-0.01em">Charging near you</h1>
  <div style="position:absolute;left:0;right:0;top:372px;bottom:0;box-sizing:border-box;padding:24px;border-radius:28px 28px 0 0;background:{{sheet}}">
    <div style="display:flex;gap:8px">
      <button style="height:36px;padding:0 16px;border-radius:999px;border:0;background:{{accent}};color:#0E1A1F;font-weight:600;font-size:14px">Cheapest</button>
      <button style="height:36px;padding:0 16px;border-radius:999px;border:1px solid {{chipBorder}};background:transparent;color:{{chipText}};font-size:14px">Closest</button>
      <button style="height:36px;padding:0 16px;border-radius:999px;border:1px solid {{chipBorder}};background:transparent;color:{{chipText}};font-size:14px">Greenest</button>
    </div>
    <div style="margin-top:22px;font-size:14px;color:{{muted}}">Voltwerk, 22 kW, 320 m away</div>
    <div style="font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:60px;line-height:1.05;color:{{priceColor}}">€16.20</div>
    <div style="font-size:14px;color:{{body}};margin-top:4px">30 kWh at €0.54 per kWh</div>
    <button style="margin-top:20px;width:100%;height:56px;border:0;border-radius:16px;background:{{accent}};color:#0E1A1F;font-size:16px;font-weight:700">Reserve at €16.20</button>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;margin-top:14px;border-top:1px solid {{rule}}">
      <div><div style="font-size:16px;font-weight:600">Nordlade</div><div style="font-size:13px;color:{{muted}};margin-top:2px">150 kW, 560 m away</div></div>
      <div style="font-size:16px;font-weight:600">€18.60</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid {{rule}}">
      <div><div style="font-size:16px;font-weight:600">Ampera Go</div><div style="font-size:13px;color:{{muted}};margin-top:2px">CCS, 740 m away</div></div>
      <div style="font-size:16px;font-weight:600">€20.70</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FFB020"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const hour = new Date().getHours();
const dark = hour >= (this.props.darkFrom ?? 19) || hour < (this.props.lightFrom ?? 7);
const day = {
bg: '#E9F0EE', ink: '#0E1A1F', sheet: '#FFFFFF', road: '#D2DEDA', roadWide: '#C6D6D0',
pin: '#5B6F69', body: '#33474A', muted: '#5B6F69', rule: '#E0E8E5',
chipBorder: '#B9CAC5', chipText: '#33474A', priceColor: '#A35F00'
};
const night = {
bg: '#0E1A1F', ink: '#E8F1EE', sheet: '#15262C', road: '#1E343B', roadWide: '#1E343B',
pin: '#8FA7A0', body: '#C9D8D3', muted: '#8FA7A0', rule: '#213A41',
chipBorder: '#2E4850', chipText: '#C9D8D3', priceColor: '#FFB020'
};
return { ...(dark ? night : day), accent: this.props.accent ?? '#FFB020' };
}
}
</script>
</body>
</html>
